<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps de Julian Ybarra</title>
<meta name="description" content="Políticas de privacidad, términos y soporte de las apps de Julian Ybarra.">
<link rel="icon" type="image/png" href="pull/assets/favicon.png">
<style>
  :root { --bg: #F3F2ED; --sheet: #FFFFFF; --fg: #15171A; --fg2: #4A4E55; --rule: #E4E2DA; --link: #2357C9; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1012; --sheet: #191B1E; --fg: #F3F4F5; --fg2: #B4BAC1; --rule: #2A2D31; --link: #86A8F2; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0; }
  p { color: var(--fg2); margin: 8px 0 0; }
  a { color: var(--link); text-underline-offset: 3px; }
  .app { display: flex; gap: 16px; align-items: center; margin-top: 32px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 18px; }
  .app img { border-radius: 14px; flex: none; }
  .app h2 { margin: 0; font-size: 20px; }
  .links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Apps de Julian Ybarra</h1>
  <p>Privacidad, términos y soporte de cada app. Contacto: <a href="mailto:junka.contact@gmail.com">junka.contact@gmail.com</a></p>
  <div class="app">
    <img src="pull/assets/icon.png" alt="" width="64" height="64">
    <div>
      <h2>Pull</h2>
      <div class="links"><a href="pull/">Inicio</a><a href="pull/privacy/">Privacidad</a><a href="pull/terms/">Términos</a><a href="pull/support/">Soporte</a><a href="pull/en/" lang="en">English</a></div>
    </div>
  </div>
</main>
</body>
</html>
